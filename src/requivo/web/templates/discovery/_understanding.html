{% if s.understanding %}
<div class="card flush">
  <div class="model-list">
    {% for r in s.understanding %}
    <div class="model-row">
      <span class="dot {{ r.dot }}" aria-hidden="true"></span>
      <span class="tag">{{ r.tag }}</span>
      <span class="name">{{ r.name }}{% if r.thin %}<span class="pill-partial">partial</span>{% endif %}</span>
      <span class="pillar">{{ r.pillar }}</span>
    </div>
    {% endfor %}
  </div>
</div>
<p class="hint"><span class="dot fact"></span> explicit fact · <span class="dot assum"></span> inferred
  assumption · <span class="dot unkwn"></span> unknown · <em>partial</em> = stated but thinly covered</p>
{% else %}
<p class="muted">Nothing captured yet — run discovery.</p>
{% endif %}
