<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The surveyor's-station brand mark (base.html), standalone: a rounded-square chip in --ink
       (#10131a) with the mark drawn in --surface (#ffffff), matching the in-app header rendering
       (#241). -->
