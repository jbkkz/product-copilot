version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Grouped for the reason oss-changelog.yml's own header records: dependabot applies its labels
    # the instant it opens a pull request, and a `labeled` trigger turns each one into a burst of
    # workflow runs (#293). Fewer pull requests is fewer bursts, and an actions bump is reviewed as
    # one decision anyway.
    groups:
      github-actions:
        patterns: ["*"]

  # Python was watched by nothing. Every runtime and extra ceiling here -- pydantic<3, anthropic<1,
  # fastapi<1, uvicorn<1, jinja2<4, python-multipart<1, pyright<2 -- moved only when a human
  # remembered, and jinja2 and python-multipart both have CVEs fixed above the floors this project
  # declares. pyproject.toml's own rationale for capping pyright said "dependabot moves both where a
  # maintainer can review the move", which was half false while pip was unconfigured: a capped tool
  # with no bump mechanism is a pin that only ever goes stale (#297).
  #
  # Version updates are what this file configures. Dependabot *security* alerts are a repository
  # setting and are not turned on by anything written here.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Only touch a requirement that cannot already accept the new version. The default rewrites the
    # *floor* of every range, and on this project a floor is not housekeeping -- it is the promise
    # `pip install requivo` makes, and the one thing scripts/dependency_floor.py exists to measure
    # (#91). Left on the default, the first run proposed exactly the damage that promise forbids:
    # `anthropic>=0.40.0,<1` -> `>=1.0.0,<2`, straight through a major ceiling this repo sets on
    # purpose; `fastapi>=0.110,<1` -> `>=0.141.1,<1`, cutting off every user between those two;
    # `python-dotenv>=1.0.0` -> `>=1.2.3`, whose releases require Python >=3.10 while this package
    # declares >=3.9, so three py3.9 legs went red; and `setuptools>=64` -> `>=84.0.0` rewritten
    # inside the prose comment that explained why 64 was the number. A ceiling bump is a statement
    # that we have run against the new major, which is a person's judgement and not a bot's.
    versioning-strategy: increase-if-necessary
    groups:
      # Two groups rather than one: a dev-tooling bump is a change to how the repo is checked and a
      # runtime bump is a change to what a user installs, and they are not reviewed the same way.
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
      runtime:
        dependency-type: production
        patterns: ["*"]
