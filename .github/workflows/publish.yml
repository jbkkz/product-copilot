name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is stored anywhere. PyPI verifies
# the run's short-lived OIDC identity against a publisher you declare once on pypi.org.
#
# Triggers:
#   - a published GitHub Release  → every future release auto-publishes
#   - manual dispatch             → to publish the current main on demand (e.g. the first release,
#                                   whose GitHub Release was cut before this workflow existed)
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/product-copilot
    permissions:
      id-token: write   # mint the OIDC token Trusted Publishing uses — this is what replaces a token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the wheel installs and runs outside the repo
        run: |
          python -m venv /tmp/verifyenv
          /tmp/verifyenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/verifyenv/bin/pc demo | grep -q "PRODUCT COPILOT — DEMO"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
