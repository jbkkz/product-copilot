name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR supersedes the previous).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Pure-logic + offline CLI units, no API calls (a fake client is injected), so no key needed.
      - run: python -m pytest tests/ -q

  wheel:
    name: Wheel install (no clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Build the wheel, install it into a clean venv, and drive it from a directory that is NOT the
      # repo — so nothing resolves via the source tree. This guards the packaging invariant: the
      # bundled assets (prompts, schema, context cards, demo payload) must ship inside the wheel, or a
      # real `pip install` outside the clone would break on the first command that builds a prompt.
      - run: pip install build
      - run: python -m build --wheel
      - name: Install the wheel into a clean venv and exercise it outside the repo
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install dist/*.whl
          mkdir /tmp/workdir && cd /tmp/workdir
          # requivo demo: offline replay from the bundled payload (no API key).
          /tmp/cleanenv/bin/requivo demo | grep -q "REQUIVO — DEMO"
          # Schema loads and every prompt builds from the installed package (not the source tree).
          /tmp/cleanenv/bin/python - <<'PY'
          from requivo.core.contracts import schema_slot_ids
          from requivo.core.context import build_prompt, available_cards
          allowed, _ = schema_slot_ids()
          assert len(allowed) > 0, "schema failed to load from the installed wheel"
          assert available_cards(), "no context cards found in the installed wheel"
          for name in ("engine.md", "brief.md", "prd.md", "stories.md",
                       "estimate.md", "criteria.md", "epic.md", "release.md"):
              p = build_prompt(name)
              assert "{{SCHEMA}}" not in p and "{{CONTEXT}}" not in p, f"{name} did not substitute"
          print("wheel install OK:", len(allowed), "slots,", len(available_cards()), "cards, 8 prompts")
          PY
      - name: Verify the web interface ships and serves from the installed wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          # Install the wheel WITH the [web] extra (+ httpx for the TestClient smoke), still outside the repo.
          /tmp/cleanenv/bin/pip install "${WHEEL}[web]" httpx
          cd /tmp/workdir
          /tmp/cleanenv/bin/requivo web --help >/dev/null   # the CLI command exists without the source tree
          /tmp/cleanenv/bin/python - <<'PY'
          from pathlib import Path
          import requivo.web
          from requivo.web.templating import TEMPLATES_DIR, STATIC_DIR
          # Templates + the vendored HTMX must be inside the installed package (not the checkout).
          assert (TEMPLATES_DIR / "base.html").exists(), "web templates missing from the wheel"
          assert (STATIC_DIR / "vendor" / "htmx.min.js").exists(), "vendored HTMX missing from the wheel"
          assert (STATIC_DIR / "css" / "app.css").exists(), "web CSS missing from the wheel"
          from fastapi.testclient import TestClient
          from requivo.web.app import create_app
          # TestClient defaults to host "testserver", which the cross-site guard correctly refuses —
          # the server answers only to loopback unless REQUIVO_ALLOWED_HOSTS says otherwise. Addressing
          # it as a real local caller does is the point of the smoke test; the previous version asserted
          # 200 against a host the guard is *supposed* to reject, and had been red since 0.9.3.
          client = TestClient(create_app(), base_url="http://127.0.0.1:8765")
          r = client.get("/health")
          assert r.status_code == 200 and r.json()["status"] == "ok", r.text
          # And the guard itself must still be doing its job from the installed wheel.
          rejected = TestClient(create_app(), base_url="http://evil.example",
                                raise_server_exceptions=False).get("/health")
          assert rejected.status_code == 403, f"cross-site guard not active: {rejected.status_code}"
          print("web wheel OK: templates + static shipped, /health 200, cross-site guard 403")
          PY
